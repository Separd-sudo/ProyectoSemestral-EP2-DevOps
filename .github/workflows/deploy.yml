name: CI/CD EKS Build Push Deploy EP3

on:
  push:
    branches:
      - deploy
env:
  AWS_ACCOUNT_ID: 716554250318
  AWS_REGION: us-east-1
  ECR_REPOSITORY_FRONTEND: innovatech-frontend
  ECR_REPOSITORY_BACKEND_VENTAS: innovatech-backend-ventas
  ECR_REPOSITORY_BACKEND_DESPACHOS: innovatech-backend-despachos
  EKS_CLUSTER_NAME: EKS-Innovatech
jobs:
  build-push-deploy:
    name: Build, Push to ECR and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código fuente desde GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar las credenciales temporales de AWS Academy
      # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN se configuran en GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # 3. Autenticar con Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # NUEVO PASO: Configurar el constructor de Docker compatible con entornos autenticados
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # 4. Construir y subir imagen del Frontend a Amazon ECR
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          provenance: false

      # 5. Construir y subir imagen de Backend Ventas a Amazon ECR
      - name: Build and push Backend Ventas image
        uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          file: ./back-Ventas_SpringBoot/Springboot-API-REST/Dockerfile
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND_VENTAS }}:latest
          provenance: false

      # 6. Construir y subir imagen de Backend Despachos a Amazon ECR
      - name: Build and push Backend Despachos image
        uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          file: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND_DESPACHOS }}:latest
          provenance: false

      # 7. Configurar kubectl para conectarse de manera automática a tu clúster de EKS
      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      # 8. Desplegar los manifiestos en el clúster (GitOps / CD automático)
      - name: Deploy Manifests to EKS
        run: |
          # Aplicamos las configuraciones globales y los servicios si existen
          kubectl apply -f k8s/global/db-secrets.yaml || true
          kubectl apply -f k8s/global/db-config.yaml || true
          
          # Forzamos la actualización de las imágenes en los pods de EKS
          kubectl apply -f k8s/backend-despachos/
          kubectl apply -f k8s/frontend-despachos/
          
          # Forzamos el reinicio para asegurar el rollout completo de las nuevas imágenes
          kubectl rollout restart deployment/backend-despachos-deployment || true
          kubectl rollout restart deployment/frontend-despachos-deployment || true