apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-despachos-hpa
  namespace: innovatech-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-despachos-deployment
  minReplicas: 2 # Mínimo de pods para Alta Disponibilidad 
  maxReplicas: 10 # Máximo de pods ante eventos de alta demanda
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Umbral de escalamiento elegido