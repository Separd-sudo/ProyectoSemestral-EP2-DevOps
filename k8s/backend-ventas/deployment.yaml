apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ventas-deployment
  namespace: innovatech-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-ventas
  template:
    metadata:
      labels:
        app: backend-ventas
    spec:
      containers:
      - name: backend-ventas
        image: 966929335910.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend-ventas:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        # CAMBIA ESTA VARIABLE IGUAL QUE EN DESPACHOS:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-ventas-service:5432/db_ventas"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres" # <--- Pon el usuario real de tu BD de ventas
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secrets
              key: POSTGRES_VENTAS_PASSWORD
        - name: SERVER_PORT
          value: "8080"