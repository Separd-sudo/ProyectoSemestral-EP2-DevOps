apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ventas-deployment
  namespace: innovatech-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-ventas
  template:
    metadata:
      labels:
        app: backend-ventas
    spec:
      containers:
      - name: backend-ventas
        image: 966929335910.dkr.ecr.us-east-1.amazonaws.com/innovatech-backend-ventas:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
        
        # CORREGIDO: Alineamos configMapKeyRef con valueFrom (2 espacios de sangría)
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: innovatech-db-config
              key: SPRING_DATASOURCE_VENTAS_URL
        
        # CORREGIDO: También corregimos la sangría aquí para evitar futuros errores
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: innovatech-db-config
              key: POSTGRES_VENTAS_USER
        
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: innovatech-db-secrets
              key: POSTGRES_VENTAS_PASSWORD
        
        - name: SERVER_PORT
          value: "8080"