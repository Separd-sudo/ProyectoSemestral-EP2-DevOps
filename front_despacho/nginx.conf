# Configuración de Nginx para servir una aplicación React/Vite.
server {
    listen 80;
    server_name localhost;

    # Carpeta donde se encuentran los archivos estáticos generados por Vite.
    root /usr/share/nginx/html;
    index index.html;

    # Permite que React Router funcione correctamente al recargar rutas.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página de error básica.
    error_page 500 502 503 504 /50x.html;
}